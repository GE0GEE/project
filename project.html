<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="North Star" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<title>North Star</title>
<style>
/* ============ FONTS / RESET ============ */
:root{
  --sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Inter", system-ui, sans-serif;
  --accent:#6E8BFF;
  --accent2:#B07CFF;
  --mint:#43E0B0;
  --peach:#FF8A6B;
  --gold:#FFCE5C;
  --pink:#FF6B95;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --safe-top:14px;
  --tab-h:84px;
  --ease-ios:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.36,.34,1);
}
html.dark{
  --bg:#000000;
  --bg2:#0A0A0C;
  --card:rgba(28,28,32,.72);
  --card-solid:#16161A;
  --card-2:rgba(255,255,255,.055);
  --stroke:rgba(255,255,255,.09);
  --stroke-strong:rgba(255,255,255,.16);
  --txt:#F5F5F7;
  --txt2:rgba(235,235,245,.62);
  --txt3:rgba(235,235,245,.34);
  --blur-bg:rgba(18,18,20,.72);
  --tab-bg:rgba(14,14,16,.76);
  --sep:rgba(255,255,255,.07);
  --fill:rgba(118,118,128,.24);
  --shadow:0 18px 44px rgba(0,0,0,.55);
}
html.light{
  --bg:#F2F2F7;
  --bg2:#FFFFFF;
  --card:rgba(255,255,255,.82);
  --card-solid:#FFFFFF;
  --card-2:rgba(0,0,0,.035);
  --stroke:rgba(0,0,0,.07);
  --stroke-strong:rgba(0,0,0,.13);
  --txt:#0B0B0F;
  --txt2:rgba(60,60,67,.62);
  --txt3:rgba(60,60,67,.32);
  --blur-bg:rgba(248,248,252,.76);
  --tab-bg:rgba(250,250,253,.8);
  --sep:rgba(0,0,0,.07);
  --fill:rgba(118,118,128,.16);
  --shadow:0 16px 40px rgba(20,20,40,.13);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--sf);
  background:#08080A;
  color:var(--txt);
  overflow:hidden;
  display:flex;align-items:stretch;justify-content:center;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.01em;
  font-feature-settings:"ss01","cv01";
}
button,input,textarea,select{font-family:inherit;color:inherit;border:none;background:none;outline:none;}
input,textarea{ -webkit-user-select:text; user-select:text;}
::-webkit-scrollbar{width:0;height:0;display:none;}
/* ============ DESKTOP STAGE / DEVICE FRAME ============ */
#stage{
  position:fixed;inset:0;
  background:
    radial-gradient(1100px 700px at 18% 8%, rgba(110,139,255,.16), transparent 60%),
    radial-gradient(900px 700px at 88% 92%, rgba(176,124,255,.14), transparent 60%),
    linear-gradient(160deg,#0B0B10,#050507 60%);
  display:flex;align-items:stretch;justify-content:center;
  padding:0;
}
#device{
  position:relative;
  width:min(100vw, 1200px);
  height:100dvh;
  border-radius:0;
  background:var(--bg);
  overflow:hidden;
  box-shadow:none;
  border:1px solid rgba(255,255,255,.06);
  transition:background .4s ease;
}
@media (max-width:840px), (max-height:900px){
  #device{width:100vw;height:100dvh;border-radius:0;box-shadow:none;border:none;}
  #stage{background:var(--bg);}
  :root{--safe-top:max(12px, env(safe-area-inset-top));}
}
/* ============ DYNAMIC ISLAND + STATUS BAR ============ */
#island{
  display:none;
}
#statusbar{
  display:none;
}
/* ============ APP SHELL ============ */
#app{position:absolute;inset:0;overflow:hidden;background:var(--bg);transition:background .4s;}
.screen{
  position:absolute;inset:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-top:calc(var(--safe-top) + 40px);
  padding-bottom:calc(var(--tab-h) + 30px);
  background:var(--bg);
  will-change:transform,opacity;
}
.screen.tabview{display:none;}
.screen.tabview.active{display:block;animation:tabIn .34s var(--ease-ios);}
@keyframes tabIn{from{opacity:0;transform:scale(.985) translateY(6px);}to{opacity:1;transform:none;}}
/* pushed sub pages */
.page{
  position:absolute;inset:0;z-index:600;background:var(--bg);
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-top:calc(var(--safe-top) + 52px);
  padding-bottom:calc(var(--tab-h) + 30px);
  transform:translateX(100%);
  transition:transform .42s var(--ease-ios), opacity .42s var(--ease-ios);
  box-shadow:-14px 0 40px rgba(0,0,0,.4);
}
.page.in{transform:translateX(0);}
.page.behind{transform:translateX(-26%);opacity:.55;}
/* ============ NAV BARS ============ */
.navbar{
  position:absolute;top:0;left:0;right:0;height:calc(var(--safe-top) + 44px);
  z-index:700;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:7px;
  background:var(--blur-bg);
  -webkit-backdrop-filter:saturate(180%) blur(26px);backdrop-filter:saturate(180%) blur(26px);
  border-bottom:.5px solid var(--sep);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.navbar.show{opacity:1;pointer-events:auto;}
.navbar .title{font-size:16.5px;font-weight:650;letter-spacing:-.02em}
.page > .pagebar{
  position:sticky;top:calc(-1 * (var(--safe-top) + 52px));
  margin-top:calc(-1 * (var(--safe-top) + 52px));
  height:calc(var(--safe-top) + 52px);
  display:flex;align-items:flex-end;gap:4px;padding:0 8px 9px;
  background:var(--blur-bg);
  -webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);
  border-bottom:.5px solid var(--sep);z-index:50;
}
.backbtn{display:flex;align-items:center;gap:3px;color:var(--accent);font-size:16.5px;font-weight:500;padding:5px 6px;border-radius:10px;transition:opacity .15s, transform .15s;}
.backbtn:active{opacity:.5;transform:scale(.96)}
.pagebar .ptitle{flex:1;text-align:center;font-size:16.5px;font-weight:650;letter-spacing:-.02em;margin-right:52px;}
.pagebar .pright{position:absolute;right:16px;bottom:9px;color:var(--accent);font-size:16px;font-weight:500;}
/* ============ TYPO ============ */
.wrap{padding:0 18px;}
h1.large{font-size:34px;font-weight:800;letter-spacing:-.033em;line-height:1.08;}
.sec-title{font-size:20.5px;font-weight:750;letter-spacing:-.028em;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;}
.sec-title .more{font-size:14.5px;font-weight:520;color:var(--accent);letter-spacing:-.01em}
.eyebrow{font-size:12.5px;font-weight:680;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);}
.sub{color:var(--txt2);font-size:14.5px;line-height:1.45;}
.tiny{font-size:11.5px;color:var(--txt3);}
/* ============ CARDS ============ */
.card{
  background:var(--card);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:.5px solid var(--stroke);
  border-radius:var(--r-md);
  box-shadow:var(--shadow);
}
.card.lg{border-radius:var(--r-lg);}
.pressable{transition:transform .22s var(--spring), opacity .18s;cursor:pointer;}
.pressable:active{transform:scale(.965);opacity:.88;}
.glow{position:relative;overflow:hidden}
.glow:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 100% at 0% 0%, rgba(255,255,255,.09), transparent 55%);pointer-events:none}
/* grouped list ios */
.group{background:var(--card);border:.5px solid var(--stroke);border-radius:16px;overflow:hidden;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:50px;position:relative;transition:background .15s;}
.row + .row:before{content:"";position:absolute;top:0;left:50px;right:0;height:.5px;background:var(--sep);}
.row.tap:active{background:var(--card-2);}
.row .ico{width:29px;height:29px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;}
.row .lbl{flex:1;font-size:16px;letter-spacing:-.015em}
.row .val{color:var(--txt2);font-size:15px;}
.chev{color:var(--txt3);font-size:17px;font-weight:300}
.grouphdr{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--txt3);padding:0 6px 7px;}
/* ============ TAB BAR ============ */
#tabbar{
  position:absolute;bottom:0;left:0;right:0;height:var(--tab-h);z-index:800;
  background:var(--tab-bg);
  -webkit-backdrop-filter:saturate(190%) blur(30px);backdrop-filter:saturate(190%) blur(30px);
  border-top:.5px solid var(--sep);
  display:flex;align-items:flex-start;padding-top:8px;
  transition:transform .35s var(--ease-ios);
}
#tabbar.hidden{transform:translateY(110%);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--txt3);transition:color .2s;padding-top:3px}
.tab svg{width:25px;height:25px;transition:transform .35s var(--spring);}
.tab span{font-size:10px;font-weight:560;letter-spacing:.01em}
.tab.active{color:var(--accent);}
.tab.active svg{transform:scale(1.1) translateY(-1px);}
.tab:active svg{transform:scale(.85);}
#homebar{display:none;}
/* ============ RINGS ============ */
.ring-svg{transform:rotate(-90deg);}
.ring-bg{stroke:var(--fill);}
.ring-fg{stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease-ios);}
/* ============ CHIPS / PILLS ============ */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 2px;scroll-snap-type:x proximity;}
.chip{
  flex:0 0 auto;padding:8px 15px;border-radius:100px;font-size:13.5px;font-weight:560;
  background:var(--card-2);border:.5px solid var(--stroke);color:var(--txt2);
  transition:all .25s var(--spring);white-space:nowrap;
}
.chip.on{background:var(--txt);color:var(--bg);border-color:transparent;transform:scale(1.02)}
.chip:active{transform:scale(.94)}
/* segmented */
.seg{display:flex;background:var(--fill);border-radius:11px;padding:2.5px;position:relative;}
.seg button{flex:1;padding:6.5px 4px;font-size:13.5px;font-weight:560;border-radius:8.5px;color:var(--txt);z-index:2;transition:color .2s;}
.seg .thumb{position:absolute;top:2.5px;bottom:2.5px;border-radius:8.5px;background:var(--card-solid);box-shadow:0 2px 8px rgba(0,0,0,.28);transition:transform .38s var(--ease-ios), width .3s;z-index:1;}
/* buttons */
.btn{padding:14px;border-radius:15px;font-size:16.5px;font-weight:620;text-align:center;transition:transform .18s var(--spring),opacity .18s;letter-spacing:-.01em}
.btn:active{transform:scale(.96);opacity:.9}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 10px 26px rgba(110,139,255,.34)}
.btn.ghost{background:var(--card-2);border:.5px solid var(--stroke);}
.btn.danger{background:rgba(255,69,58,.14);color:#FF6961}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}
/* toggle */
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .3s;flex:0 0 auto}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .32s var(--spring)}
.sw.on{background:#32D74B}
.sw.on:after{transform:translateX(20px)}
/* inputs */
.inp{width:100%;background:var(--card-2);border:.5px solid var(--stroke);border-radius:13px;padding:13px 14px;font-size:16px;transition:border-color .2s, background .2s}
.inp:focus{border-color:var(--accent);background:var(--card-solid)}
textarea.inp{resize:none;line-height:1.5}
/* sheet / modal */
#sheetwrap{position:absolute;inset:0;z-index:950;pointer-events:none;}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .35s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#sheetwrap.open{pointer-events:auto}
#sheetwrap.open #scrim{opacity:1}
#sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:92%;
  background:var(--bg2);border-radius:26px 26px 0 0;
  transform:translateY(100%);transition:transform .46s var(--ease-ios);
  display:flex;flex-direction:column;overflow:hidden;
  border-top:.5px solid var(--stroke-strong);
  box-shadow:0 -20px 50px rgba(0,0,0,.5)
}
#sheetwrap.open #sheet{transform:translateY(0)}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--txt3);margin:9px auto 4px;flex:0 0 auto}
#sheetbody{overflow-y:auto;padding:8px 18px calc(30px + env(safe-area-inset-bottom));}
/* toast */
#toast{
  position:absolute;left:50%;top:calc(var(--safe-top) + 54px);transform:translate(-50%,-24px) scale(.94);
  background:var(--blur-bg);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:.5px solid var(--stroke-strong);color:var(--txt);
  padding:11px 18px;border-radius:100px;font-size:14px;font-weight:560;z-index:990;opacity:0;pointer-events:none;
  transition:all .42s var(--spring);box-shadow:0 12px 30px rgba(0,0,0,.4);max-width:88%;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
/* progress bars */
.pbar{height:7px;border-radius:4px;background:var(--fill);overflow:hidden}
.pbar > i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .9s var(--ease-ios)}
/* scroll rows */
.hscroll{display:flex;gap:13px;overflow-x:auto;padding:2px 18px 6px;scroll-snap-type:x mandatory}
.hscroll > *{scroll-snap-align:start;flex:0 0 auto}
/* poster */
.poster{border-radius:12px;overflow:hidden;background:var(--card-2);position:relative;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;opacity:.3}
/* habit check */
.hcheck{width:30px;height:30px;border-radius:50%;border:2px solid var(--stroke-strong);display:flex;align-items:center;justify-content:center;transition:all .35s var(--spring);flex:0 0 auto}
.hcheck.done{background:var(--mint);border-color:var(--mint);transform:scale(1.06)}
.hcheck svg{opacity:0;transform:scale(.3);transition:all .3s var(--spring)}
.hcheck.done svg{opacity:1;transform:scale(1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1.06)}}
.hcheck.pop{animation:pop .45s var(--spring)}
/* fab */
.fab{
  position:absolute;right:16px;bottom:calc(var(--tab-h) + 14px);z-index:780;
  padding:13px 19px;border-radius:100px;color:#fff;font-weight:650;font-size:14.5px;
  background:linear-gradient(135deg,#FF7A5C,#FF4F81);
  box-shadow:0 14px 34px rgba(255,79,129,.42);
  display:flex;align-items:center;gap:8px;
  transition:transform .25s var(--spring);
  animation:breathe 3.4s ease-in-out infinite;
}
.fab:active{transform:scale(.92)}
@keyframes breathe{0%,100%{box-shadow:0 14px 34px rgba(255,79,129,.36)}50%{box-shadow:0 16px 44px rgba(255,79,129,.62)}}
/* pull to refresh */
#ptr{position:absolute;top:calc(var(--safe-top) + 40px);left:50%;transform:translateX(-50%);z-index:500;opacity:0;transition:opacity .2s;pointer-events:none}
.spin{width:22px;height:22px;border:2.5px solid var(--stroke-strong);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* fade in stagger */
.fadein{animation:fi .5s var(--ease-ios) both}
@keyframes fi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* onboarding */
#onb{position:absolute;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;transition:opacity .6s, transform .6s var(--ease-ios)}
#onb.gone{opacity:0;transform:scale(1.06);pointer-events:none}
#splash{position:absolute;inset:0;z-index:1100;background:radial-gradient(circle at top,#111318 0%,#06070a 65%,#000 100%);display:flex;align-items:center;justify-content:center;transition:opacity .7s var(--ease-ios), transform .7s var(--ease-ios);overflow:hidden}
#splash.fade{opacity:0;transform:scale(1.04);pointer-events:none}
.splash-ring{position:absolute;border:2px solid rgba(255,255,255,.18);border-radius:50%;animation:spinSplash 2.4s linear infinite}
.splash-core{position:relative;width:128px;height:128px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:0 22px 60px rgba(0,0,0,.45);background:linear-gradient(140deg,rgba(110,139,255,.9),rgba(176,124,255,.75));color:#fff}
.splash-core::before,.splash-core::after{content:'';position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.26)}
.splash-core::before{width:92px;height:92px}
.splash-core::after{width:64px;height:64px}
@keyframes spinSplash{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.obslide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 34px 150px;opacity:0;transform:translateX(40px);transition:all .55s var(--ease-ios);pointer-events:none}
.obslide.on{opacity:1;transform:none;pointer-events:auto}
.aurora{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(16px,-26px) scale(1.13)}}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat{padding:14px;border-radius:18px;background:var(--card);border:.5px solid var(--stroke)}
.stat .n{font-size:24px;font-weight:780;letter-spacing:-.03em;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--txt2);margin-top:3px;font-weight:520}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar .col{width:100%;max-width:26px;border-radius:6px;background:var(--fill);position:relative;overflow:hidden;display:flex;align-items:flex-end}
.bar .col i{display:block;width:100%;border-radius:6px;background:linear-gradient(180deg,var(--accent),var(--accent2));transition:height .9s var(--ease-ios)}
.blur-mask{-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.reader{font-size:17px;line-height:1.72;letter-spacing:-.011em}
.reader p{margin-bottom:19px}
mark{background:rgba(255,206,92,.32);color:inherit;border-radius:3px;padding:1px 2px}
.hl-pop{position:absolute;background:var(--card-solid);border:.5px solid var(--stroke-strong);border-radius:12px;padding:6px;display:flex;gap:4px;z-index:60;box-shadow:var(--shadow)}
</style>
</head>
<body>
<div id="stage">
  <div id="device">
    <div id="island"><div id="island-content"><span class="isl-dot"></span><span id="isl-txt">Saved</span></div></div>
    <div id="statusbar">
      <div id="sb-time">9:41</div>
      <div id="sb-right">
        <svg class="sb-ico" width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".4"/></svg>
        <svg class="sb-ico" width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 11.5 6 8.8a3.6 3.6 0 0 1 5 0l-2.5 2.7Z"/><path d="M8.5 3.2c2 0 3.9.75 5.3 2.1l1.5-1.6A9.4 9.4 0 0 0 8.5 1 9.4 9.4 0 0 0 1.7 3.7l1.5 1.6A7.6 7.6 0 0 1 8.5 3.2Z" opacity=".95"/><path d="M8.5 6.5c1.1 0 2.2.42 3 1.2l1.5-1.6a6.6 6.6 0 0 0-9 0L5.5 7.7a4.3 4.3 0 0 1 3-1.2Z"/></svg>
        <svg class="sb-ico" width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x=".7" y=".7" width="21" height="11.6" rx="3.6" stroke="currentColor" opacity=".4"/><rect x="2.4" y="2.4" width="15" height="8.2" rx="2.2" fill="currentColor"/><path d="M23.2 4.4v4.2c1-.3 1.6-1 1.6-2.1s-.6-1.8-1.6-2.1Z" fill="currentColor" opacity=".4"/></svg>
      </div>
    </div>
    <div id="app">

function habitRow(h){

    <div style="flex:1;min-width:0"><div style="font-weight:620;font-size:15px;letter-spacing:-.015em">${esc(h.name)}</div>
      <div class="tiny" style="margin-top:2px">🔥 ${streak(h)} day streak · ${rate(h)}% this month</div></div>
    <div class="hcheck${done?' done':''}" data-check="${h.id}"><svg width="14" height="11" viewBox="0 0 14 11" fill="none"><path d="M1.5 5.6 5 9.2 12.5 1.6" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>`;
}
function bindHabitRows(root){
  $$('[data-check]',root).forEach(c=>c.onclick=e=>{
    e.stopPropagation();const h=S.habits.find(x=>x.id===c.dataset.check);const k=todayKey();
    if(h.log[k]){delete h.log[k];c.classList.remove('done');}
    else{h.log[k]=true;c.classList.add('done','pop');setTimeout(()=>c.classList.remove('pop'),480);
      toast(streak(h)>1?`🔥 ${streak(h)} day streak · ${h.name}`:`${h.name} complete`);}
    save(true);
    const p=c.closest('.habitrow');if(p){const t=$('.tiny',p);if(t)t.textContent=`🔥 ${streak(h)} day streak · ${rate(h)}% this month`;}
  });
  $$('.habitrow',root).forEach(r=>r.onclick=()=>openHabitDetail(r.dataset.id));
}

function openAppleHealth(){

  const scheme='x-apple-health://';

 Stress:{i:'😤',acts:[['🚶','Take a 10-minute walk','Movement metabolises cortisol faster than thought does.'],['🏋️','Do 20 push-ups','Physical exertion discharges the stress response.'],['🧘','Box breathing 4-4-4-4','Signals safety to your nervous system in 90 seconds.'],['🎧','Play a grounding playlist','Music down-regulates the amygdala.'],['✍️','Brain-dump journal','Naming the stressor reduces its intensity.']]},
 Anxiety:{i:'😰',acts:[['🫁','Physiological sigh ×5','Double inhale, long exhale. Fastest known calm-down.'],['❄️','Cold water on face','Triggers the dive reflex, slows heart rate.'],['📝','Write the worst case','Anxiety shrinks when it becomes specific.'],['🚶','Walk outside','Bilateral movement processes anxious loops.']]},
 Loneliness:{i:'🫂',acts:[['📞','Call someone you trust','Connection is the antidote, not distraction.'],['📖','Read 20 pages','Borrow another mind for a while.'],['🌳','Go outside somewhere public','Ambient belonging counts.'],['✉️','Send one honest message','Small bids create real bonds.']]},
 Boredom:{i:'🥱',acts:[['💻','Practice coding for 25 min','Boredom is under-stimulation — build something.'],['📚','Start a new chapter','Depth beats scrolling.'],['🎬','Watch a film you\'ve been saving','Intentional entertainment ≠ escape.'],['🏃','Quick cardio burst','Reset dopamine baseline honestly.']]},
 Anger:{i:'😠',acts:[['🥊','Hard physical output','Anger is energy that wants a direction.'],['✍️','Unsent letter technique','Write it fully. Never send it.'],['🚿','Cold shower','Interrupts the surge.'],['⏱️','Wait 20 minutes','Anger has a half-life. Outlast it.']]},
 Sadness:{i:'😔',acts:[['🌤️','Get 10 min of daylight','Light regulates mood chemistry.'],['🛋️','Comfort movie from Bangers','Sadness deserves care, not numbing.'],['🙏','Write 3 gratitudes','Trains attention toward what remains good.'],['📞','Tell someone the truth','Shared weight is lighter.']]},
 Fatigue:{i:'🥲',acts:[['💧','Drink a full glass of water','Fatigue is often dehydration.'],['😴','20 minute nap, no more','Restores without sleep inertia.'],['🚶','Gentle walk, no phone','Motion beats caffeine after 3pm.'],['🌙','Sleep before midnight tonight','Protect tomorrow now.']]},
 Overwhelmed:{i:'🌀',acts:[['📋','Write only the next 3 tasks','Shrink the frame.'],['⏳','Set a 15-minute timer','Start ugly, momentum follows.'],['🧹','Clear one surface','External order calms internal noise.'],['🚫','Say no to one thing','Capacity is a boundary, not a flaw.']]}
};
function openUrge(){
  openSheet(`<div>
    <div style="text-align:center;margin:6px 0 4px;font-size:20px;font-weight:760;letter-spacing:-.03em">What are you feeling?</div>
    <div class="sub" style="text-align:center;margin-bottom:18px">Naming it is already half the work.</div>
    <div class="grid2" id="urgegrid">
      ${Object.entries(URGES).map(([k,v])=>`<button class="pressable" data-u="${k}" style="background:var(--card-2);border:.5px solid var(--stroke);border-radius:17px;padding:15px;text-align:left">
        <div style="font-size:22px">${v.i}</div><div style="font-weight:640;margin-top:6px;font-size:15px">${k}</div></button>`).join('')}
    </div>
    <div class="tiny" style="text-align:center;margin-top:16px">Urges peak and fall within 20 minutes. You only have to outlast the wave.</div>
  </div>`,b=>{
    $$('[data-u]',b).forEach(x=>x.onclick=()=>{haptic();showUrgeResult(x.dataset.u);});
  });
}
function showUrgeResult(feel){
  const u=URGES[feel];
  S.urges.unshift({feel,at:new Date().toISOString()});save(true);
  $('#sheetbody').innerHTML=`<div>
    <div style="text-align:center;margin:6px 0 3px;font-size:34px">${u.i}</div>
    <div style="text-align:center;font-size:20px;font-weight:760;letter-spacing:-.03em">${feel}</div>
    <div class="sub" style="text-align:center;margin:6px 0 18px">Try one of these instead — pick the easiest.</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${u.acts.map(a=>`<button class="card pressable" data-act="${esc(a[1])}" style="padding:14px;display:flex;gap:12px;align-items:flex-start;text-align:left">
        <div style="font-size:21px">${a[0]}</div><div><div style="font-weight:640;font-size:15px">${a[1]}</div><div class="sub" style="font-size:12.5px;margin-top:3px">${a[2]}</div></div></button>`).join('')}
    </div>
    <button class="btn primary" id="urgedone" style="width:100%;margin-top:18px">I rode the wave 🌊</button>
    <div class="tiny" style="text-align:center;margin-top:12px">Logged ${S.urges.length} urges surfed. Each one rewires the loop.</div>
  </div>`;
  $$('[data-act]',$('#sheetbody')).forEach(a=>a.onclick=()=>{toast('Good choice: '+a.dataset.act);closeSheet();});
  $('#urgedone').onclick=()=>{closeSheet();toast('Urge surfed. That\'s the rep. 💪');};
}
/* ── Mood check ── */
function openMoodSheet(){
  const k=todayKey();const m=S.moods[k]||{mood:3,energy:3,sleep:7,water:0};
  openSheet(`<div>
    <div style="text-align:center;font-weight:760;font-size:20px;margin:6px 0 16px;letter-spacing:-.03em">Daily Check-in</div>
    <div class="eyebrow">Mood</div>
    <div style="display:flex;gap:8px;margin:9px 0 18px" id="moodpick">
      ${['😞','😕','😐','🙂','😄'].map((e,i)=>`<button class="pressable" data-v="${i+1}" style="flex:1;aspect-ratio:1;border-radius:16px;background:var(--card-2);border:1.5px solid ${m.mood===i+1?'var(--accent)':'transparent'};font-size:24px">${e}</button>`).join('')}
    </div>
    <div class="eyebrow">Energy <span style="float:right;color:var(--txt2)" id="elab">${m.energy}/5</span></div>
    <input type="range" min="1" max="5" value="${m.energy}" id="erange" style="width:100%;margin:12px 0 18px;accent-color:var(--accent)">
    <div class="eyebrow">Sleep <span style="float:right;color:var(--txt2)" id="slab">${m.sleep}h</span></div>
    <input type="range" min="0" max="12" step="0.5" value="${m.sleep}" id="srange" style="width:100%;margin:12px 0 18px;accent-color:var(--accent)">
    <div class="eyebrow">Water</div>
    <div style="display:flex;gap:6px;margin:10px 0 20px" id="waterrow">
      ${Array.from({length:8},(_,i)=>`<button data-w="${i+1}" class="pressable" style="flex:1;aspect-ratio:.75;border-radius:10px;background:${i<(m.water||0)?'linear-gradient(180deg,#5AC8FA,#6E8BFF)':'var(--card-2)'};border:.5px solid var(--stroke);font-size:13px">💧</button>`).join('')}
    </div>
    <button class="btn primary" id="msave" style="width:100%">Save Check-in</button></div>`,b=>{
    let d={...m};
    $$('#moodpick button',b).forEach(x=>x.onclick=()=>{d.mood=+x.dataset.v;haptic();$$('#moodpick button',b).forEach(y=>y.style.borderColor='transparent');x.style.borderColor='var(--accent)';});
    $('#erange',b).oninput=e=>{d.energy=+e.target.value;$('#elab',b).textContent=d.energy+'/5';};
    $('#srange',b).oninput=e=>{d.sleep=+e.target.value;$('#slab',b).textContent=d.sleep+'h';};
    $$('#waterrow button',b).forEach(x=>x.onclick=()=>{d.water=+x.dataset.w;haptic();$$('#waterrow button',b).forEach((y,i)=>y.style.background=i<d.water?'linear-gradient(180deg,#5AC8FA,#6E8BFF)':'var(--card-2)');});
    $('#msave',b).onclick=()=>{S.moods[k]=d;save();closeSheet();toast('Check-in saved');if(cur==='health')SCREENS.health($('#scr-health'));if(cur==='home')SCREENS.home($('#scr-home'));};
  });
}
/* ── WORKOUT ── */
const ROUTINES={
 Push:['Bench Press','Overhead Press','Incline DB Press','Lateral Raise','Triceps Pushdown'],
 Pull:['Deadlift','Pull-Up','Barbell Row','Face Pull','Barbell Curl'],
 Legs:['Back Squat','Romanian Deadlift','Leg Press','Leg Curl','Calf Raise'],
 Upper:['Bench Press','Barbell Row','Overhead Press','Lat Pulldown','Curl'],
 Lower:['Back Squat','Hip Thrust','Lunge','Leg Extension','Calf Raise'],
 'Full Body':['Squat','Bench Press','Barbell Row','Overhead Press','Plank'],
 Cardio:['Run','Cycling','Rowing','Incline Walk','Jump Rope'],
 Custom:[]
};
function openWorkoutHub(){
  const total=S.workouts.length;
  const mins=S.workouts.reduce((a,w)=>a+(+w.mins||0),0);
  const cals=S.workouts.reduce((a,w)=>a+(+w.cals||0),0);
  const w=[],lbl=[];const names=['S','M','T','W','T','F','S'];
  for(let i=6;i>=0;i--){const k=dayAdd(todayKey(),-i);w.push(S.workouts.filter(x=>x.date===k).reduce((a,x)=>a+(+x.mins||0),0));lbl.push(names[new Date(k+'T12:00:00').getDay()]);}
  const html=`<div class="wrap" style="padding-top:10px">
    <div class="grid3">
      <div class="stat"><div class="n">${total}</div><div class="l">Workouts</div></div>
      <div class="stat"><div class="n">${Math.round(mins/60)}h</div><div class="l">Total Time</div></div>
      <div class="stat"><div class="n">${cals}</div><div class="l">Calories</div></div>
    </div>
    <div class="sec-title" style="margin-top:20px">Start a Routine</div>
    <div class="grid2">${Object.keys(ROUTINES).map(r=>`<button class="card pressable" data-r="${r}" style="padding:15px;text-align:left">
      <div style="font-weight:660;font-size:15.5px">${r}</div><div class="tiny">${ROUTINES[r].length?ROUTINES[r].length+' exercises':'Build your own'}</div></button>`).join('')}</div>
    <div class="sec-title" style="margin-top:22px">This Week (min)</div>
    <div class="card" style="padding:16px">${weekBars(w,lbl,'linear-gradient(180deg,#FF8A6B,#FF4F81)')}</div>
    <div class="sec-title" style="margin-top:22px">History</div>
    <div style="display:flex;flex-direction:column;gap:9px">
      ${total?S.workouts.slice(0,12).map(x=>`<div class="card pressable" data-wk="${x.id}" style="padding:14px;display:flex;gap:12px;align-items:center">
        <div style="width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#FF8A6B33,#FF4F8133);display:flex;align-items:center;justify-content:center;font-size:17px">🏋️</div>
        <div style="flex:1"><div style="font-weight:640;font-size:15px">${esc(x.type)}</div><div class="tiny">${x.date} · ${x.mins||0} min · ${x.ex?.length||0} exercises${x.cals?' · '+x.cals+' kcal':''}</div></div><span class="chev">›</span></div>`).join('')
      :'<div class="card" style="padding:22px;text-align:center"><div style="font-size:26px">💪</div><div class="sub" style="margin-top:8px">No workouts yet. Pick a routine above.</div></div>'}
    </div>
    <div class="sec-title" style="margin-top:22px">Body & Progress</div>
    <div class="grid2">
      <button class="card pressable" data-x="measure" style="padding:15px;text-align:left"><div style="font-size:20px">📏</div><div style="font-weight:640;margin-top:6px;font-size:15px">Measurements</div><div class="tiny">${S.measures.length} entries</div></button>
      <button class="card pressable" data-x="photos" style="padding:15px;text-align:left"><div style="font-size:20px">📸</div><div style="font-weight:640;margin-top:6px;font-size:15px">Progress Photos</div><div class="tiny">${S.photos.length} saved</div></button>
      <button class="card pressable" data-x="timer" style="padding:15px;text-align:left"><div style="font-size:20px">⏱️</div><div style="font-weight:640;margin-top:6px;font-size:15px">Rest Timer</div><div class="tiny">60 · 90 · 120s</div></button>
      <button class="card pressable" data-x="prs" style="padding:15px;text-align:left"><div style="font-size:20px">🏆</div><div style="font-weight:640;margin-top:6px;font-size:15px">Personal Records</div><div class="tiny">All time bests</div></button>
    </div>
    <div style="height:24px"></div></div>`;
  pushPage('Workout',html,p=>{
    $$('[data-r]',p).forEach(b=>b.onclick=()=>openWorkoutNew(b.dataset.r));
    $$('[data-wk]',p).forEach(b=>b.onclick=()=>openWorkoutDetail(b.dataset.wk));
    $$('[data-x]',p).forEach(b=>b.onclick=()=>{const x=b.dataset.x;
      if(x==='timer')openTimer();else if(x==='measure')openMeasures();else if(x==='photos')openPhotos();else openPRs();});
  });
}
function openWorkoutNew(type='Push'){
  const ex=(ROUTINES[type]||[]).map(n=>({name:n,sets:[{r:10,w:0}]}));
  const wk={id:uid(),type,date:todayKey(),mins:0,cals:0,notes:'',ex};
  let t0=Date.now(),timer;
  const html=`<div class="wrap" style="padding-top:10px">
    <div class="card lg" style="padding:18px;display:flex;align-items:center;gap:14px">
      <div style="flex:1"><div class="eyebrow">Active session</div><div style="font-size:30px;font-weight:800;letter-spacing:-.04em" id="wtimer">00:00</div></div>
      <button class="btn ghost sm" id="restbtn">⏱️ Rest</button>
    </div>
    <div class="sec-title" style="margin-top:20px">${esc(type)} <span class="more" id="addex">+ Exercise</span></div>
    <div id="exlist" style="display:flex;flex-direction:column;gap:11px"></div>
    <div class="sec-title" style="margin-top:20px">Notes</div>
    <textarea class="inp" id="wnotes" rows="3" placeholder="How did it feel? Energy, form, mood…"></textarea>
    <div class="grid2" style="margin-top:14px">
      <input class="inp" id="wcals" placeholder="Calories" inputmode="numeric">
      <input class="inp" id="wmins" placeholder="Minutes" inputmode="numeric">
    </div>
    <button class="btn primary" id="finish" style="width:100%;margin-top:16px">Finish Workout</button>
    <div style="height:24px"></div></div>`;
  pushPage('New Workout',html,p=>{
    timer=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);
      const el=$('#wtimer',p);if(!el){clearInterval(timer);return;}
      el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;},1000);
    const draw=()=>{
      $('#exlist',p).innerHTML=wk.ex.map((e,i)=>`<div class="card" style="padding:14px">
        <div style="display:flex;align-items:center;gap:8px"><div style="flex:1;font-weight:650;font-size:15px">${esc(e.name)}</div>
        <button class="tiny" data-rm="${i}" style="color:#FF6961">Remove</button></div>
        <div style="display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:7px;margin-top:10px;align-items:center">
          <div class="tiny">#</div><div class="tiny">Reps</div><div class="tiny">Weight (kg)</div><div></div>
          ${e.sets.map((s,j)=>`
            <div class="tiny" style="font-weight:640">${j+1}</div>
            <input class="inp" style="padding:8px 10px;font-size:14px" value="${s.r}" data-s="${i}-${j}-r" inputmode="numeric">
            <input class="inp" style="padding:8px 10px;font-size:14px" value="${s.w}" data-s="${i}-${j}-w" inputmode="decimal">
            <button data-ds="${i}-${j}" style="color:var(--txt3);font-size:18px">−</button>`).join('')}
        </div>
        <button class="btn ghost sm" data-as="${i}" style="width:100%;margin-top:9px">+ Add Set</button></div>`).join('');
      $$('[data-as]',p).forEach(b=>b.onclick=()=>{const i=+b.dataset.as;const l=wk.ex[i].sets[wk.ex[i].sets.length-1]||{r:10,w:0};wk.ex[i].sets.push({...l});haptic();draw();});
      $$('[data-ds]',p).forEach(b=>b.onclick=()=>{const[i,j]=b.dataset.ds.split('-').map(Number);wk.ex[i].sets.splice(j,1);if(!wk.ex[i].sets.length)wk.ex[i].sets.push({r:10,w:0});draw();});
      $$('[data-rm]',p).forEach(b=>b.onclick=()=>{wk.ex.splice(+b.dataset.rm,1);draw();});
      $$('[data-s]',p).forEach(inp=>inp.onchange=()=>{const[i,j,f]=inp.dataset.s.split('-');wk.ex[+i].sets[+j][f]=parseFloat(inp.value)||0;});
    };draw();
    $('#addex',p).onclick=()=>{openSheet(`<div><div style="text-align:center;font-weight:700;font-size:18px;margin:6px 0 14px">Add Exercise</div>
      <input class="inp" id="exn" placeholder="Exercise name" autofocus>
      <div class="eyebrow" style="margin:16px 0 8px">Quick add</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px">${[...new Set(Object.values(ROUTINES).flat())].slice(0,16).map(n=>`<button class="chip" data-q="${esc(n)}">${esc(n)}</button>`).join('')}</div>
      <button class="btn primary" id="exadd" style="width:100%;margin-top:18px">Add</button></div>`,b=>{
        const add=n=>{if(!n)return;wk.ex.push({name:n,sets:[{r:10,w:0}]});closeSheet();draw();toast('Added '+n);};
        $$('[data-q]',b).forEach(x=>x.onclick=()=>add(x.dataset.q));
        $('#exadd',b).onclick=()=>add($('#exn',b).value.trim());
      });};
    $('#restbtn',p).onclick=openTimer;
    $('#finish',p).onclick=()=>{
      wk.mins=parseInt($('#wmins',p).value)||Math.max(1,Math.round((Date.now()-t0)/60000));
      wk.cals=parseInt($('#wcals',p).value)||Math.round(wk.mins*7.5);
      wk.notes=$('#wnotes',p).value;
      S.workouts.unshift(wk);
      const hw=S.habits.find(h=>h.name==='Workout');if(hw)hw.log[todayKey()]=true;
      save();clearInterval(timer);popPage();toast(`Workout logged · ${wk.mins} min · ${wk.cals} kcal`);island('Workout complete 🏋️');};
  });
}
function openWorkoutDetail(id){
  const w=S.workouts.find(x=>x.id===id);if(!w)return;
  const html=`<div class="wrap" style="padding-top:10px">
    <div class="grid3"><div class="stat"><div class="n">${w.mins}</div><div class="l">Minutes</div></div>
    <div class="stat"><div class="n">${w.cals}</div><div class="l">Calories</div></div>
    <div class="stat"><div class="n">${w.ex.length}</div><div class="l">Exercises</div></div></div>
    <div class="sec-title" style="margin-top:20px">Exercises</div>
    <div style="display:flex;flex-direction:column;gap:10px">
    ${w.ex.map(e=>`<div class="card" style="padding:14px"><div style="font-weight:650;font-size:15px">${esc(e.name)}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:9px">${e.sets.map((s,i)=>`<div style="padding:6px 11px;border-radius:9px;background:var(--card-2);font-size:12.5px;font-weight:560">${s.r}×${s.w}kg</div>`).join('')}</div></div>`).join('')}</div>
    ${w.notes?`<div class="sec-title" style="margin-top:20px">Notes</div><div class="card" style="padding:15px"><div class="sub" style="color:var(--txt)">${esc(w.notes)}</div></div>`:''}
    <button class="btn danger" id="dw" style="width:100%;margin-top:20px">Delete Workout</button></div>`;
  pushPage(w.type+' · '+w.date,html,p=>{$('#dw',p).onclick=()=>{S.workouts=S.workouts.filter(x=>x.id!==id);save();popPage();toast('Deleted');};});
}
function openTimer(){
  let left=90,iv=null;
  openSheet(`<div style="text-align:center;padding-bottom:10px">
    <div style="font-weight:760;font-size:20px;margin:6px 0 16px;letter-spacing:-.03em">Rest Timer</div>
    <div id="tdisp" style="font-size:60px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums">1:30</div>
    <div style="display:flex;gap:8px;justify-content:center;margin:16px 0">
      ${[30,60,90,120,180].map(s=>`<button class="chip" data-t="${s}">${s}s</button>`).join('')}
    </div>
    <div style="display:flex;gap:10px"><button class="btn ghost" id="tstart" style="flex:1">Start</button><button class="btn ghost" id="treset" style="flex:1">Reset</button></div></div>`,b=>{
    const upd=()=>$('#tdisp',b).textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
    $$('[data-t]',b).forEach(x=>x.onclick=()=>{left=+x.dataset.t;upd();haptic();});
    $('#tstart',b).onclick=e=>{if(iv){clearInterval(iv);iv=null;e.target.textContent='Start';return;}
      e.target.textContent='Pause';iv=setInterval(()=>{left--;upd();if(left<=0){clearInterval(iv);iv=null;toast('Rest complete 🔔');haptic();closeSheet();}},1000);};
    $('#treset',b).onclick=()=>{clearInterval(iv);iv=null;left=90;upd();$('#tstart',b).textContent='Start';};
  });
}
function openMeasures(){
  const fields=['Weight (kg)','Chest','Waist','Hips','Arms','Thighs'];
  const html=`<div class="wrap" style="padding-top:10px">
    <div class="card" style="padding:16px">
      <div class="grid2">${fields.map(f=>`<div><div class="tiny" style="margin-bottom:5px">${f}</div><input class="inp" data-m="${f}" inputmode="decimal" placeholder="–"></div>`).join('')}</div>
      <button class="btn primary" id="msave2" style="width:100%;margin-top:14px">Save Measurement</button></div>
    <div class="sec-title" style="margin-top:20px">History</div>
    <div style="display:flex;flex-direction:column;gap:9px">${S.measures.length?S.measures.map(m=>`<div class="card" style="padding:14px">
      <div style="font-weight:640;font-size:14.5px">${m.date}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${Object.entries(m.v).filter(([,v])=>v).map(([k,v])=>`<div style="padding:5px 10px;border-radius:9px;background:var(--card-2);font-size:12px">${k.split(' ')[0]}: ${v}</div>`).join('')}</div></div>`).join(''):'<div class="card" style="padding:20px;text-align:center"><div class="sub">Track your body over time.</div></div>'}</div></div>`;
  pushPage('Measurements',html,p=>{
    $('#msave2',p).onclick=()=>{const v={};$$('[data-m]',p).forEach(i=>{if(i.value)v[i.dataset.m]=i.value;});
      if(!Object.keys(v).length)return toast('Enter at least one value');
      S.measures.unshift({date:todayKey(),v});save();popPage();toast('Measurement saved');};
  });
}
function openPhotos(){
  const html=`<div class="wrap" style="padding-top:10px">
    <button class="btn ghost" id="addphoto" style="width:100%">📸 Add Progress Photo</button>
    <input type="file" accept="image/*" id="pfile" style="display:none">
    <div class="grid2" id="pgrid" style="margin-top:16px"></div>

let readingSuggestionsState={loading:false,loaded:false,items:[],lastQuery:'',searchItems:[]};
async function searchBookSuggestions(query, limit=4){
  const url=`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=${limit}&fields=key,title,author_name,cover_i,number_of_pages_median,first_publish_year,ratings_average,subject`;
  const res=await fetch(url,{mode:'cors'});
  if(!res.ok) throw new Error('Book suggestions request failed');
  const data=await res.json();
  return (data.docs||[])
    .filter(item=>item.title)
    .slice(0,limit)
    .map(item=>({
      id:item.key||`${item.title}-${item.author_name?.[0]||'unknown'}`,
      title:item.title || 'Untitled',
      author:(item.author_name||[]).join(', ') || 'Unknown author',
      pages:item.number_of_pages_median || 0,
      thumbnail:item.cover_i ? `https://covers.openlibrary.org/b/id/${item.cover_i}-M.jpg` : '',
      year:item.first_publish_year || '',
      rating:item.ratings_average || 0,
      subjects:(item.subject||[]).slice(0,3)
    }))
    .sort((a,b)=>b.rating-a.rating || a.title.localeCompare(b.title));
}
function addGoogleBookToLibrary(book, refresh){
  if(!book) return;
  const exists=S.books.some(b=>b.title.toLowerCase()===book.title.toLowerCase());
  if(exists){toast('Already in your library'); if(refresh) refresh(); return;}
  const pal=[['#6E8BFF','#B07CFF'],['#FF8A6B','#FF4F81'],['#43E0B0','#5AC8FA'],['#FFCE5C','#FF8A6B']][S.books.length%4];
  S.books.push({id:uid(),title:book.title,author:book.author,pages:book.pages||300,page:0,status:'want',minutes:0,notes:'',fav:false,color:pal[0],color2:pal[1],started:todayKey()});
  save();
  toast(`Added ${book.title} to Want to Read`);
  if(refresh) refresh();
}
async function renderBookResults(root, books, refresh){
  if(!root) return;
  if(!books.length){
    root.innerHTML=`<div class="card" style="padding:14px"><div class="sub" style="font-size:13.5px">No books found.</div></div>`;
    return;
  }
  root.innerHTML=`<div class="hscroll" style="padding:2px 0 6px">${books.map((b,i)=>`<div class="card" style="width:138px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start">
      ${b.thumbnail?`<img src="${b.thumbnail}" alt="${esc(b.title)}" style="width:100%;height:96px;border-radius:8px;object-fit:cover;flex:0 0 auto">`:`<div style="width:100%;height:96px;border-radius:8px;background:linear-gradient(140deg,#6E8BFF,#B07CFF);display:flex;align-items:center;justify-content:center;font-size:18px">📖</div>`}
      <div style="width:100%"><div style="font-weight:650;font-size:13.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(b.title)}</div><div class="tiny" style="margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(b.author)}</div>${b.pages?`<div class="tiny" style="margin-top:3px">${b.pages} pages</div>`:''}</div>
      <button class="btn ghost sm" data-gb-index="${i}" style="width:100%">Add</button></div>`).join('')}</div>`;
  $$('[data-gb-index]', root).forEach(btn=>btn.onclick=()=>addGoogleBookToLibrary(books[+btn.dataset.gbIndex], refresh));
}
async function loadBookSuggestions(root, refresh){
  if(!root) return;
  if(readingSuggestionsState.loaded && readingSuggestionsState.items.length){
    await renderBookResults(root, readingSuggestionsState.items, refresh);
    return;
  }
  if(readingSuggestionsState.loading) return;
  root.innerHTML=`<div class="card" style="padding:14px"><div class="sub" style="font-size:13.5px">Loading suggestions…</div></div>`;
  readingSuggestionsState.loading=true;
  try{
    const queries=['bestseller','top books','must read','award winning fiction','self improvement','psychology'];
    const results=[];
    for(const q of queries){
      const items=await searchBookSuggestions(q,2);
      items.forEach(i=>results.push(i));
      if(results.length>=6) break;
    }
    const books=[...new Map(results.map(i=>[i.id,i])).values()].slice(0,6);
    if(!books.length){root.innerHTML=`<div class="card" style="padding:14px"><div class="sub" style="font-size:13.5px">Book suggestions aren’t available right now. Try again in a moment.</div></div>`; return;}
    readingSuggestionsState.items=books;
    readingSuggestionsState.loaded=true;
    await renderBookResults(root, books, refresh);
  }catch(e){
    root.innerHTML=`<div class="card" style="padding:14px"><div class="sub" style="font-size:13.5px">Unable to load book suggestions right now.</div></div>`;
  }finally{readingSuggestionsState.loading=false;}
}
async function searchBooksFromInput(root, query, refresh){
  if(!root) return;
  const q=query.trim();
  if(!q){await loadBookSuggestions(root, refresh); return;}
  if(readingSuggestionsState.lastQuery===q && readingSuggestionsState.searchItems.length){
    await renderBookResults(root, readingSuggestionsState.searchItems, refresh);
    return;
  }
  root.innerHTML=`<div class="card" style="padding:14px"><div class="sub" style="font-size:13.5px">Searching…</div></div>`;
  try{
    const books=await searchBookSuggestions(q,6);
    readingSuggestionsState.lastQuery=q;
    readingSuggestionsState.searchItems=books;
    await renderBookResults(root, books, refresh);
  }catch(e){
    root.innerHTML=`<div class="card" style="padding:14px"><div class="sub" style="font-size:13.5px">Unable to search books right now.</div></div>`;
  }
}

  pushPage('Year in Review',`<div class="wrap" style="padding-top:14px">
    ${[['🔁',habitTotal,'habits completed','#6E8BFF'],['🏋️',S.workouts.length,'workouts finished','#FF8A6B'],['✍️',S.journals.length,'journal entries','#43E0B0'],['📚',S.books.filter(b=>b.status==='finished').length,'books read','#FFCE5C'],['🎬',watched.length,'films watched','#B07CFF'],['🌊',S.urges.length,'urges surfed','#FF6B95']].map((r,i)=>`
      <div class="card lg fadein" style="animation-delay:${i*.08}s;padding:22px;margin-bottom:12px;background:linear-gradient(135deg,${r[3]}22,transparent)">
        <div style="font-size:27px">${r[0]}</div>
        <div style="font-size:41px;font-weight:820;letter-spacing:-.045em;margin-top:5px;color:${r[3]}">${r[1]}</div>
        <div class="sub" style="margin-top:2px">${r[2]}</div></div>`).join('')}
    <div class="card lg" style="padding:22px;text-align:center;background:linear-gradient(140deg,rgba(110,139,255,.2),rgba(176,124,255,.12))">
      <div style="font-size:17px;font-weight:680;line-height:1.45;letter-spacing:-.02em">You spent this year building instead of escaping.</div>
      <div class="sub" style="margin-top:8px">Keep going. The compounding has only started.</div></div>
    <div style="height:26px"></div></div>`);
}

function openTMDbSettings(){
  const html=`<div class="wrap" style="padding-top:12px">
    <div class="card lg" style="padding:20px;text-align:center;background:linear-gradient(140deg,rgba(1,180,228,.16),rgba(144,206,161,.09))">
      <div style="font-size:32px">🎬</div>
      <div style="font-weight:740;font-size:18px;margin-top:8px;letter-spacing:-.03em">The Movie Database</div>
      <div class="sub" style="margin-top:6px;font-size:13.5px">Powers search, posters, cast, trailers and recommendations. Your ratings and collections never leave this device.</div>
    </div>
    <div class="grouphdr" style="margin-top:22px">API Key</div>
    <div class="group">
      <div class="row" style="padding:12px 14px"><input class="inp" id="keyin" style="background:transparent;border:none;padding:0;font-size:15.5px" placeholder="Paste your TMDb API key or read access token" value="${S.tmdb.key?'••••••••••••'+S.tmdb.key.slice(-4):''}"></div>
      <div class="row"><div class="lbl" style="font-size:14.5px">Status</div><div class="val" id="stat" style="color:${S.tmdb.ok?'#32D74B':'var(--txt2)'}">${S.tmdb.ok?'✅ Connected':(S.tmdb.key?'Not tested':'No key configured')}</div></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn primary" id="ksave" style="flex:1">Save Key</button>
      <button class="btn ghost" id="ktest" style="flex:1">Test Connection</button>
    </div>
    <button class="btn ghost" id="krep" style="width:100%;margin-top:10px">Replace API Key</button>
    <button class="btn danger" id="kdel" style="width:100%;margin-top:10px">Remove API Key</button>
    <div class="grouphdr" style="margin-top:24px">Enabled once connected</div>
    <div class="group">
      ${['Search Movies','Trending','Popular','Top Rated','Now Playing','Upcoming','Browse by Genre','Movie Posters','Cast & Crew','Similar Movies','YouTube Trailers'].map(f=>`
      <div class="row"><div class="ico" style="background:${S.tmdb.ok?'rgba(50,215,75,.16)':'var(--card-2)'}">${S.tmdb.ok?'✓':'○'}</div><div class="lbl" style="font-size:15px">${f}</div></div>`).join('')}
    </div>
    <div class="grouphdr" style="margin-top:22px">Stored locally, never sent</div>
    <div class="group"><div class="row"><div class="lbl sub" style="font-size:13.5px;line-height:1.5;padding:4px 0">Personal Rating · Watchlist · Watched Status · Date Watched · Review · Notes · Tags · Rewatch Count · Custom Genres</div></div></div>
    <a href="https://www.themoviedb.org/settings/api" target="_blank" class="tiny" style="display:block;text-align:center;margin-top:18px;color:var(--accent);text-decoration:none">Get a free API key at themoviedb.org ↗</a>
    <div style="height:24px"></div></div>`;
  pushPage('TMDb',html,p=>{
    const inp=$('#keyin',p),stat=$('#stat',p);let dirty=false;
    inp.onfocus=()=>{if(!dirty&&S.tmdb.key){inp.value='';dirty=true;}};
    inp.oninput=()=>dirty=true;
    const setStat=(t,c)=>{stat.textContent=t;stat.style.color=c;};
    $('#ksave',p).onclick=()=>{const v=inp.value.trim();
      if(!v||v.includes('•'))return toast('Enter a key first');
      S.tmdb.key=v;S.tmdb.ok=false;save();inp.value='••••••••••••'+v.slice(-4);dirty=false;
      setStat('Saved · not tested','var(--txt2)');toast('API key saved');testKey();};
    $('#ktest',p).onclick=testKey;
    async function testKey(){
      if(!S.tmdb.key)return toast('No API key saved');
      setStat('Testing…','var(--txt2)');
      try{await tmdb('/configuration');S.tmdb.ok=true;save(true);setStat('✅ Connected','#32D74B');toast('✅ Successfully connected to TMDb');island('TMDb connected 🎬');
        $$('.group .row .ico',p).forEach(i=>{if(i.textContent==='○'){i.textContent='✓';i.style.background='rgba(50,215,75,.16)';}});
      }catch(e){S.tmdb.ok=false;save(true);setStat('❌ Invalid API Key','#FF6961');toast('❌ Invalid API Key');}
    }
    $('#krep',p).onclick=()=>{inp.value='';dirty=true;inp.focus();setStat('Enter new key','var(--txt2)');};
    $('#kdel',p).onclick=()=>{S.tmdb={key:'',ok:false};save();inp.value='';setStat('No key configured','var(--txt2)');toast('API key removed');};
  });
}
/* ══════════════════════════════════════════════════════════
   ONBOARDING
   ══════════════════════════════════════════════════════════ */
function startOnboarding(){
  const o=$('#onb');o.classList.remove('gone');o.style.display='flex';
  const slides=[
   {e:'✦',t:'North Star',s:'Build a life you don\'t need to escape from.',b:'Begin'},
   {e:'🧠',t:'Replace,<br>don\'t remove',s:'Every unhealthy coping mechanism is solving a real problem badly. North Star helps you find a better answer — walking instead of scrolling, lifting instead of numbing.',b:'Continue'},
   {e:'📈',t:'Never miss<br>twice',s:'Streaks build identity. Missing once is human. Missing twice is the start of a new pattern. We\'ll never call you a failure — only remind you of the next rep.',b:'Continue'},
   {e:'🎬',t:'Intentional<br>entertainment',s:'Films, books and essays worth your attention — tracked, rated and remembered. Meaningful input instead of infinite feeds.',b:'Continue'},
   {e:'👋',t:'What should<br>we call you?',s:'',b:'Start my journey',input:true}
  ];
  o.innerHTML=`
    <div class="aurora" style="width:300px;height:300px;background:#6E8BFF;top:-60px;left:-70px"></div>
    <div class="aurora" style="width:260px;height:260px;background:#B07CFF;bottom:120px;right:-80px;animation-delay:1.5s"></div>
    <div class="aurora" style="width:200px;height:200px;background:#FF8A6B;top:44%;left:36%;animation-delay:3s;opacity:.3"></div>
    <div id="stars"></div>
    ${slides.map((s,i)=>`<div class="obslide${i===0?' on':''}" data-i="${i}">
      <div style="font-size:56px;margin-bottom:22px;filter:drop-shadow(0 8px 22px rgba(110,139,255,.5))">${s.e}</div>
      <div style="font-size:38px;font-weight:820;letter-spacing:-.042em;line-height:1.06">${s.t}</div>
      ${s.s?`<div class="sub" style="margin-top:16px;font-size:16px;line-height:1.55;max-width:310px">${s.s}</div>`:''}
      ${s.input?`<input class="inp" id="obname" placeholder="Your name" style="margin-top:22px;font-size:17px;padding:15px" value="${esc(S.user.name==='Alex'?'':S.user.name)}">`:''}
    </div>`).join('')}
    <div style="position:absolute;left:0;right:0;bottom:52px;padding:0 34px">
      <div style="display:flex;gap:7px;justify-content:center;margin-bottom:22px" id="dots">
        ${slides.map((_,i)=>`<div style="width:${i===0?18:7}px;height:7px;border-radius:4px;background:${i===0?'var(--accent)':'var(--fill)'};transition:all .4s var(--spring)"></div>`).join('')}
      </div>
      <button class="btn primary" id="obnext" style="width:100%">Begin</button>
      <button id="obskip" style="width:100%;margin-top:12px;color:var(--txt3);font-size:14px;font-weight:520">Skip</button>
    </div>`;
  const sc=$('#stars',o);let sh='';
  for(let i=0;i<40;i++)sh+=`<div class="star" style="width:${Math.random()*2+1}px;height:${Math.random()*2+1}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s"></div>`;
  sc.innerHTML=sh;
  let i=0;
  const show=n=>{
    $$('.obslide',o).forEach(s=>s.classList.toggle('on',+s.dataset.i===n));
    [...$('#dots',o).children].forEach((d,x)=>{d.style.width=(x===n?18:7)+'px';d.style.background=x===n?'var(--accent)':'var(--fill)';});
    $('#obnext',o).textContent=slides[n].b;
    $('#obskip',o).style.display=n===slides.length-1?'none':'block';
    if(slides[n].input)setTimeout(()=>$('#obname',o)?.focus(),450);
  };
  $('#obnext',o).onclick=()=>{haptic();
    if(i<slides.length-1){i++;show(i);}
    else{const n=$('#obname',o).value.trim();if(n)S.user.name=n;S.onboarded=true;S.user.since=S.user.since||todayKey();save(true);finish();}};
  $('#obskip',o).onclick=()=>{S.onboarded=true;save(true);finish();};
  function finish(){o.classList.add('gone');setTimeout(()=>o.style.display='none',700);go('home');island('Welcome to North Star ✦');}
  let tx=0;o.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
  o.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;
    if(d<-60&&i<slides.length-1){i++;show(i);}else if(d>60&&i>0){i--;show(i);}});
}
/* ══════════════════════════════════════════════════════════
   PULL TO REFRESH + BOOT
   ══════════════════════════════════════════════════════════ */
function initPTR(){
  let start=0,pulling=false;
  const sc=$('#screens');
  sc.addEventListener('touchstart',e=>{const a=$('.screen.active');if(a&&a.scrollTop<=0){start=e.touches[0].clientY;pulling=true;}},{passive:true});
  sc.addEventListener('touchmove',e=>{if(!pulling)return;const d=e.touches[0].clientY-start;
    if(d>0){$('#ptr').style.opacity=Math.min(1,d/70);$('#ptr').style.transform=`translateX(-50%) translateY(${Math.min(46,d/2)}px) rotate(${d*2}deg)`;}},{passive:true});
  sc.addEventListener('touchend',e=>{if(!pulling)return;pulling=false;const d=e.changedTouches[0].clientY-start;
    $('#ptr').style.transform='translateX(-50%)';
    if(d>72){$('#ptr').style.opacity='1';haptic();
      setTimeout(()=>{$('#ptr').style.opacity='0';SCREENS[cur]($(`#scr-${cur}`));attachScroll($(`#scr-${cur}`),TITLES[cur]);island('Refreshed');},700);}
    else $('#ptr').style.opacity='0';});
}
function boot(){
  $('#screens').innerHTML=TABS.map(t=>`<div class="screen tabview" id="scr-${t.id}"></div>`).join('');
  renderTabs();initPTR();
  if(!S.onboarded){S.onboarded=true;save(true);}
  const splash=$('#splash');
  const finishBoot=()=>{
    $('#onb').classList.add('gone');
    $('#onb').style.display='none';
    splash.classList.add('fade');
    setTimeout(()=>{splash.style.display='none';},700);
    const el=$('#scr-home');el.classList.add('active');SCREENS.home(el);attachScroll(el,'North Star');
    $('#tabbar').classList.remove('hidden');
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(S.theme==='system')applyTheme();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sheetwrap').classList.contains('open'))closeSheet();else if(pageStack.length)popPage();}});
  };
  setTimeout(finishBoot,750);
}
boot();
</script>
